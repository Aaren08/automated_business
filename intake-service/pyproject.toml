[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-intake"
version = "0.1.0"
description = "Supplier Product Intelligence Intake Service"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Automated Business Project", email = "dev@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Web framework
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # Database
    "supabase>=2.0",
    "asyncpg>=0.29",

    # Object storage
    "boto3>=1.34",
    "minio>=7.2",

    # File parsing
    "python-magic>=0.4.27",
    "markdown-it-py>=3.0",
    "pymupdf>=1.23",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas>=2.2",

    # OCR
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",

    # Image processing
    "pillow>=10.2",
    "imagehash>=4.3",

    # AI/ML (optional)
    "openai>=1.12",
    "instructor>=1.1",

    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "filelock>=3.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]